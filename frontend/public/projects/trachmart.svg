<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tmBg" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e1020"/>
      <stop offset="1" stop-color="#14172e"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#tmBg)"/>
  <circle cx="400" cy="240" r="300" fill="url(#aura)"/>

  <!-- Top App Navigation Bar -->
  <rect x="50" y="40" width="700" height="50" rx="12" fill="#1b1e36" stroke="#2d3257" stroke-width="1.5"/>
  <circle cx="80" cy="65" r="7" fill="#ef4444" opacity="0.8"/>
  <circle cx="102" cy="65" r="7" fill="#f59e0b" opacity="0.8"/>
  <circle cx="124" cy="65" r="7" fill="#10b981" opacity="0.8"/>

  <!-- Brand Title -->
  <text x="160" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">TrachMart Shop</text>
  <rect x="580" y="52" width="140" height="26" rx="13" fill="url(#purpleGlow)"/>
  <text x="650" y="69" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cart (3 Items)</text>

  <!-- Hero Banner inside Mockup -->
  <rect x="50" y="110" width="700" height="130" rx="16" fill="#16182e" stroke="#2b2f54" stroke-width="1.5"/>
  <text x="90" y="160" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5">SPRING TECH DEALS</text>
  <text x="90" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Next-Gen Laptops &amp; Accessories</text>
  <rect x="90" y="210" width="110" height="20" rx="10" fill="url(#purpleGlow)"/>
  <text x="145" y="224" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Shop Now →</text>

  <!-- Laptop Graphic Illustration -->
  <rect x="520" y="130" width="180" height="90" rx="8" fill="#202542" stroke="#8b5cf6" stroke-width="1"/>
  <path d="M500 220 L720 220 L700 230 L520 230 Z" fill="#2d3257"/>

  <!-- Product Grid -->
  <!-- Card 1 -->
  <rect x="50" y="260" width="215" height="180" rx="14" fill="#16182e" stroke="#252a4a" stroke-width="1.5"/>
  <rect x="75" y="280" width="165" height="85" rx="10" fill="#202444"/>
  <path d="M140 305 L175 305 L170 335 L145 335 Z" fill="#8b5cf6" opacity="0.7"/>
  <text x="75" y="390" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Pro Gaming Laptop</text>
  <text x="75" y="415" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">$1,299</text>
  <rect x="180" y="400" width="60" height="24" rx="6" fill="#8b5cf6"/>
  <text x="210" y="416" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ Add</text>

  <!-- Card 2 -->
  <rect x="292" y="260" width="215" height="180" rx="14" fill="#16182e" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="317" y="280" width="165" height="85" rx="10" fill="#202444"/>
  <circle cx="400" cy="322" r="28" fill="#7c3aed" opacity="0.6"/>
  <text x="317" y="390" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Wireless Earbuds</text>
  <text x="317" y="415" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">$149</text>
  <rect x="422" y="400" width="60" height="24" rx="6" fill="#8b5cf6"/>
  <text x="452" y="416" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ Add</text>

  <!-- Card 3 -->
  <rect x="535" y="260" width="215" height="180" rx="14" fill="#16182e" stroke="#252a4a" stroke-width="1.5"/>
  <rect x="560" y="280" width="165" height="85" rx="10" fill="#202444"/>
  <rect x="620" y="300" width="45" height="50" rx="6" fill="#3b82f6" opacity="0.6"/>
  <text x="560" y="390" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Smart Watch Ultra</text>
  <text x="560" y="415" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">$299</text>
  <rect x="665" y="400" width="60" height="24" rx="6" fill="#8b5cf6"/>
  <text x="695" y="416" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ Add</text>
</svg>
