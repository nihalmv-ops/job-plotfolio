<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="smBg" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0c18"/>
      <stop offset="1" stop-color="#14152b"/>
    </linearGradient>
    <linearGradient id="scannerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="purpleBtn" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#smBg)"/>

  <!-- Top POS Header -->
  <rect x="50" y="40" width="700" height="50" rx="12" fill="#181a33" stroke="#2b2f54" stroke-width="1.5"/>
  <circle cx="80" cy="65" r="7" fill="#ef4444" opacity="0.8"/>
  <circle cx="102" cy="65" r="7" fill="#f59e0b" opacity="0.8"/>
  <circle cx="124" cy="65" r="7" fill="#10b981" opacity="0.8"/>
  <text x="160" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">SmartMart AI — Supermarket POS &amp; Inventory</text>
  <rect x="620" y="52" width="100" height="26" rx="8" fill="#10b981" opacity="0.2"/>
  <text x="670" y="69" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ONLINE • POS #04</text>

  <!-- Left: Real-time Barcode Scanner & Search Area -->
  <rect x="50" y="110" width="440" height="330" rx="16" fill="#16182e" stroke="#252a4e" stroke-width="1.5"/>
  <text x="80" y="145" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">AI INVENTORY &amp; BILLING TERMINAL</text>

  <!-- Scan Box -->
  <rect x="80" y="165" width="380" height="110" rx="12" fill="#111322" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6"/>
  <line x1="100" y1="220" x2="440" y2="220" stroke="url(#scannerGlow)" stroke-width="3"/>
  <text x="270" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Barcode Scanner Active</text>
  <text x="270" y="250" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">SKU: 890123456789 [Organic Milk 1L]</text>

  <!-- Recent Scanned Items Table -->
  <text x="80" y="310" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Current Cart Batch</text>
  <rect x="80" y="325" width="380" height="35" rx="6" fill="#1d203b"/>
  <text x="95" y="347" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Organic Whole Milk 1L</text>
  <text x="350" y="347" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">x 2</text>
  <text x="430" y="347" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">$7.98</text>

  <rect x="80" y="370" width="380" height="35" rx="6" fill="#17192f"/>
  <text x="95" y="392" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Almond Butter 500g</text>
  <text x="350" y="392" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">x 1</text>
  <text x="430" y="392" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">$8.50</text>

  <!-- Right: Cashier Checkout Invoice Panel -->
  <rect x="510" y="110" width="240" height="330" rx="16" fill="#16182e" stroke="#2b2f54" stroke-width="1.5"/>
  <text x="535" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Invoice Summary</text>

  <text x="535" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Subtotal</text>
  <text x="725" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">$16.48</text>

  <text x="535" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Tax (GST 5%)</text>
  <text x="725" y="215" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">$0.82</text>

  <line x1="535" y1="240" x2="725" y2="240" stroke="#252a4e"/>

  <text x="535" y="275" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Total Amount</text>
  <text x="725" y="275" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="end">$17.30</text>

  <!-- Checkout Button -->
  <rect x="535" y="315" width="190" height="45" rx="12" fill="url(#purpleBtn)"/>
  <text x="630" y="343" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Complete Sale &amp; Print 🖨️</text>

  <!-- Stock Status -->
  <text x="630" y="390" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">✓ MongoDB Stock Sync Active</text>
  <text x="630" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Invoice #SM-2026-8819</text>
</svg>
